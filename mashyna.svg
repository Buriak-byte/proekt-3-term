<svg xmlns="http://w3.org" viewBox="0 0 400 200" width="100%" height="100%">
  <!-- Нижнє дно/тінь машини -->
  <ellipse cx="200" cy="175" rx="160" ry="10" fill="#dddddd" />
  
  <!-- Корпус автомобіля -->
  <path d="M 40,165 
           L 40,140 
           Q 40,115 70,110 
           L 110,105 
           Q 140,55 190,55 
           L 280,55 
           Q 320,55 340,105 
           L 360,115 
           Q 380,120 380,140 
           L 380,165 
           Z" 
        fill="#1e88e5" />
  
  <!-- Дах та вікна (внутрішня частина) -->
  <!-- Заднє вікно -->
  <path d="M 125,103 L 145,67 L 195,67 L 195,103 Z" fill="#e3f2fd" />
  <!-- Переднє вікно -->
  <path d="M 205,103 L 205,67 L 275,67 Q 300,67 315,103 Z" fill="#e3f2fd" />
  
  <!-- Фари -->
  <!-- Передня фара -->
  <path d="M 365,120 Q 380,120 378,135 Q 365,135 365,120 Z" fill="#fff59d" />
  <!-- Задня фара -->
  <path d="M 40,125 Q 30,125 32,140 Q 42,140 42,125 Z" fill="#e53935" />

  <!-- Колеса -->
  <!-- Заднє колесо -->
  <circle cx="100" cy="165" r="30" fill="#263238" />
  <circle cx="100" cy="165" r="15" fill="#cfd8dc" />
  <circle cx="100" cy="165" r="7" fill="#78909c" />

  <!-- Переднє колесо -->
  <circle cx="300" cy="165" r="30" fill="#263238" />
  <circle cx="300" cy="165" r="15" fill="#cfd8dc" />
  <circle cx="300" cy="165" r="7" fill="#78909c" />
</svg>